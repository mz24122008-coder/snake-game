<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Змейка Баттл</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f0f1a 70%); color: white; font-family: -apple-system, sans-serif; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px; }
        .screen { display: none; flex-direction: column; align-items: center; width: 100%; height: 100%; justify-content: center; }
        .screen.active { display: flex; }
        #userBox { display: none; align-items: center; gap: 10px; padding: 8px 14px; background: rgba(74, 222, 128, 0.08); border: 1px solid rgba(74, 222, 128, 0.3); border-radius: 40px; margin-bottom: 20px; font-size: 14px; color: #cbd5e1; }
        #userBox.show { display: flex; }
        #userAvatar { width: 32px; height: 32px; border-radius: 50%; background: #4ade80; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #0f0f1a; font-size: 14px; }
        #userName { font-weight: 600; color: #4ade80; }
        h1 { font-size: 46px; font-weight: 900; background: linear-gradient(135deg, #4ade80, #22d3ee); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: -2px; margin-bottom: 6px; }
        .subtitle { color: #94a3b8; margin-bottom: 32px; font-size: 13px; letter-spacing: 3px; }
        .menu-btn { width: 250px; padding: 18px; margin: 6px 0; background: rgba(74, 222, 128, 0.08); border: 2px solid #4ade80; color: #4ade80; font-size: 17px; font-weight: 700; border-radius: 16px; cursor: pointer; -webkit-appearance: none; appearance: none; font-family: inherit; }
        .menu-btn:active, .menu-btn.pressed { background: #4ade80; color: #0f0f1a; transform: scale(0.96); }
        .menu-btn.primary { background: #4ade80; color: #0f0f1a; }
        .menu-btn.primary:active, .menu-btn.primary.pressed { background: #22c55e; }
        .buy-btn { width: 250px; padding: 18px; margin: 6px 0; background: rgba(250, 204, 21, 0.1); border: 2px solid #facc15; color: #facc15; font-size: 17px; font-weight: 700; border-radius: 16px; cursor: pointer; -webkit-appearance: none; appearance: none; font-family: inherit; }
        .buy-btn:active, .buy-btn.pressed { background: #facc15; color: #0f0f1a; transform: scale(0.96); }
        .high-score { margin-top: 24px; color: #facc15; font-size: 14px; letter-spacing: 1px; }
        #hud { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 500px; padding: 0 10px 8px; font-size: 14px; font-weight: 700; }
        #scoreHud { color: #4ade80; }
        #speedHud { color: #22d3ee; }
        #fpsHud { color: #64748b; font-size: 12px; }
        #game { background: #0a0a14; border-radius: 16px; box-shadow: 0 0 40px rgba(74, 222, 128, 0.18), inset 0 0 0 1px rgba(74, 222, 128, 0.2); touch-action: none; display: block; }
        #controls { margin-top: 14px; display: grid; grid-template-columns: repeat(3, 78px); grid-template-rows: repeat(2, 78px); gap: 10px; }
        .btn { background: linear-gradient(180deg, rgba(74,222,128,0.14), rgba(74,222,128,0.06)); border: 2px solid rgba(74, 222, 128, 0.7); color: #4ade80; font-size: 32px; font-weight: bold; border-radius: 18px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 rgba(34, 197, 94, 0.3); cursor: pointer; -webkit-appearance: none; appearance: none; font-family: inherit; }
        .btn.pressed { background: #4ade80; color: #0f0f1a; transform: translateY(2px); box-shadow: 0 2px 0 rgba(34, 197, 94, 0.5); }
        #overTitle { font-size: 36px; color: #ef4444; margin-bottom: 10px; font-weight: 900; letter-spacing: -1px; }
        #overScore { font-size: 22px; color: #4ade80; margin-bottom: 4px; font-weight: 700; }
        #overInfo { font-size: 13px; color: #94a3b8; margin-bottom: 8px; }
        #overHigh { font-size: 14px; color: #facc15; margin-bottom: 16px; min-height: 20px; }
        #submitStatus { font-size: 12px; color: #64748b; min-height: 16px; margin-bottom: 12px; }
        #lbTitle { font-size: 30px; font-weight: 900; margin-bottom: 8px; background: linear-gradient(135deg, #facc15, #4ade80); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        #lbRules { font-size: 11px; color: #64748b; margin-bottom: 14px; text-align: center; line-height: 1.5; }
        #lbList { width: 100%; max-width: 380px; background: rgba(10, 10, 20, 0.6); border: 1px solid rgba(74, 222, 128, 0.2); border-radius: 16px; padding: 8px; max-height: 50vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .lbRow { display: flex; align-items: center; gap: 8px; padding: 10px 10px; border-radius: 10px; font-size: 14px; margin-bottom: 3px; }
        .lbRow.me { background: rgba(74, 222, 128, 0.15); border: 1px solid rgba(74, 222, 128, 0.4); }
        .lbRank { width: 30px; font-weight: 900; color: #94a3b8; text-align: center; flex-shrink: 0; }
        .lbRank.top1 { color: #facc15; font-size: 18px; }
        .lbRank.top2 { color: #cbd5e1; font-size: 17px; }
        .lbRank.top3 { color: #f59e0b; font-size: 17px; }
        .lbMain { flex: 1; min-width: 0; }
        .lbName { color: #e2e8f0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
        .lbSub { color: #64748b; font-size: 11px; margin-top: 2px; }
        .lbScore { color: #4ade80; font-weight: 900; font-size: 18px; text-align: right; }
        #lbStatus { color: #64748b; font-size: 14px; padding: 40px 20px; text-align: center; }
        #lbRefresh { margin-top: 14px; padding: 12px 28px; background: rgba(74, 222, 128, 0.1); border: 2px solid rgba(74, 222, 128, 0.5); color: #4ade80; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer; -webkit-appearance: none; appearance: none; font-family: inherit; }
        #lbCacheInfo { color: #475569; font-size: 11px; margin-top: 8px; min-height: 14px; }
        #countdown {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            display: none; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.8); z-index: 1000;
            font-size: 140px; font-weight: 900; color: #4ade80;
            text-shadow: 0 0 40px #4ade80, 0 0 80px #22c55e;
        }
        #countdown.show { display: flex; }
        #countdown.pulse { animation: pulse 0.9s ease-out; }
        @keyframes pulse {
            0% { transform: scale(1.6); opacity: 0.3; }
            60% { transform: scale(0.95); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        #errorBox {
            position: fixed; top: 0; left: 0; right: 0;
            background: #ef4444; color: white;
            padding: 12px; font-size: 12px;
            z-index: 9999; display: none;
            word-break: break-all; max-height: 40vh; overflow-y: auto;
        }
    </style>
</head>
<body>

    <div id="errorBox"></div>
    <div id="countdown"></div>

    <div id="menuScreen" class="screen active">
        <div id="userBox">
            <div id="userAvatar">?</div>
            <span>Привет, <span id="userName">игрок</span>!</span>
        </div>
        <h1>ЗМЕЙКА</h1>
        <div class="subtitle">BATTLE EDITION</div>
        <button class="menu-btn primary" onclick="startGame()">▶  Играть</button>
        <button class="menu-btn" onclick="showScreen('leaderboardScreen')">🏆  Рейтинг</button>
        <button class="menu-btn" onclick="shareScore()">📤  Поделиться</button>
        <button class="menu-btn" onclick="showSkinInfo()">🎨  Скины (скоро)</button>
        <div class="high-score">Рекорд: <span id="menuHigh">0</span></div>
    </div>

    <div id="gameScreen" class="screen">
        <div id="hud">
            <span id="scoreHud">Счёт: 0</span>
            <span id="speedHud">x1.0</span>
            <span id="fpsHud">-- FPS</span>
        </div>
        <canvas id="game"></canvas>
        <div id="controls">
            <div></div>
            <div class="btn" data-dir="up">▲</div>
            <div></div>
            <div class="btn" data-dir="left">◀</div>
            <div class="btn" data-dir="down">▼</div>
            <div class="btn" data-dir="right">▶</div>
        </div>
    </div>

    <div id="overScreen" class="screen">
        <div id="overTitle">ИГРА ОКОНЧЕНА</div>
        <div id="overScore">Счёт: 0</div>
        <div id="overInfo"></div>
        <div id="overHigh"></div>
        <div id="submitStatus"></div>
        <button class="buy-btn" onclick="buyLife()" id="buyLifeBtn">💚 Вторая жизнь за 15⭐</button>
        <button class="menu-btn primary" onclick="startGame()">🔄  Ещё раз</button>
        <button class="menu-btn" onclick="showScreen('leaderboardScreen')">🏆  Рейтинг</button>
        <button class="menu-btn" onclick="showScreen('menuScreen')">🏠  Меню</button>
    </div>

    <div id="leaderboardScreen" class="screen">
        <div id="lbTitle">🏆  ТОП ИГРОКОВ</div>
        <div id="lbRules">
            1️⃣ Больше очков &nbsp;•&nbsp; 2️⃣ Меньше возрождений &nbsp;•&nbsp; 3️⃣ Меньше времени
        </div>
        <div id="lbList"><div id="lbStatus">Загрузка...</div></div>
        <div id="lbCacheInfo"></div>
        <button id="lbRefresh" onclick="renderLeaderboard(true)">🔄  Обновить</button>
        <button class="menu-btn" onclick="showScreen('menuScreen')" style="margin-top:10px;">🏠  В меню</button>
    </div>

<script>
// ================== ОТЛОВ ОШИБОК ==================
window.onerror = function(msg, url, line, col, error) {
    var box = document.getElementById('errorBox');
    if (box) {
        box.style.display = 'block';
        box.textContent = 'ОШИБКА: ' + msg + ' (строка ' + line + ')';
    }
    return false;
};

// ================== КОНФИГ ==================
var BIN_ID = '6aa93256ac6210605acffcdf';
var MASTER_KEY = '$2a$10$3jAxvBubFU/n15BoFgKVS.SIL5E/j1fcLADrALJEk3hrvhiOXvNvi';
var API_BASE = 'https://api.jsonbin.io/v3/b/';

var CACHE_TTL = 3 * 60 * 1000;
var scoresCache = null;
var scoresCacheTime = 0;
var lastSubmitTime = 0;
var SUBMIT_COOLDOWN = 5000;

// ================== TELEGRAM ==================
var tg = window.Telegram ? window.Telegram.WebApp : null;
var tgUser = null;
if (tg) {
    try { tg.ready(); tg.expand(); tgUser = tg.initDataUnsafe && tg.initDataUnsafe.user; }
    catch(e) { console.warn(e); }
}

// ================== НАСТРОЙКИ ==================
var GRID = 20, BASE_SPEED = 200, MIN_SPEED = 70, SPEED_STEP = 4;

// ================== СОСТОЯНИЕ ==================
var canvas, ctx, cellSize, dpr, canvasSize;
var snake, oldSnake, dir, nextDir, score, food, speed, foodEaten;
var lastTick = 0, lastFrameTime = 0, rafId = null, running = false;
var particles = [];
var frameCount = 0, fpsLastUpdate = 0, fps = 60;
var highScore = parseInt(localStorage.getItem('snakeHigh') || '0', 10);
var leaderboardOpen = false, lbInterval = null;
var isBuyingLife = false;

// Текущая партия
var gameStartTime = 0, gameTime = 0, reviveCount = 0, savedState = null;

// ================== INIT CANVAS ==================
function initCanvas() {
    canvas = document.getElementById('game');
    ctx = canvas.getContext('2d');
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    var availW = window.innerWidth - 24;
    var availH = window.innerHeight - 320;
    var size = Math.min(availW, availH, 500);
    size = Math.floor(size / GRID) * GRID;
    canvasSize = size;
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cellSize = size / GRID;
}

// ================== USER ==================
function setupUser() {
    if (!tgUser) return;
    var box = document.getElementById('userBox');
    box.classList.add('show');
    var name = tgUser.first_name || tgUser.username || 'игрок';
    document.getElementById('userName').textContent = name;
    document.getElementById('userAvatar').textContent = name.charAt(0).toUpperCase();
}

// ================== UTILS ==================
function formatTime(sec) {
    sec = Math.floor(sec);
    if (sec < 60) return sec + ' сек';
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    return m + ' мин' + (s > 0 ? ' ' + s + ' сек' : '');
}

// ================== API ==================
function fetchScores(forceRefresh) {
    var now = Date.now();
    if (!forceRefresh && scoresCache && (now - scoresCacheTime) < CACHE_TTL) {
        return Promise.resolve(scoresCache);
    }
    return fetch(API_BASE + BIN_ID + '/latest', {
        headers: { 'X-Master-Key': MASTER_KEY, 'X-Bin-Meta': 'false' }
    }).then(function(res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
    }).then(function(data) {
        scoresCache = (data && data.scores) ? data.scores : [];
        scoresCacheTime = now;
        return scoresCache;
    });
}

function saveScores(scores) {
    return fetch(API_BASE + BIN_ID, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'X-Master-Key': MASTER_KEY },
        body: JSON.stringify({ scores: scores })
    }).then(function(res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        scoresCache = scores;
        scoresCacheTime = Date.now();
        return res.json();
    });
}

function sortScores(arr) {
    arr.sort(function(a, b) {
        if (b.score !== a.score) return b.score - a.score;
        var aR = a.revives || 0, bR = b.revives || 0;
        if (aR !== bR) return aR - bR;
        var aT = a.time || 0, bT = b.time || 0;
        return aT - bT;
    });
    return arr;
}

function submitScore(finalScore, finalTime, finalRevives) {
    if (!tgUser || finalScore <= 0) return;
    var now = Date.now();
    if (now - lastSubmitTime < SUBMIT_COOLDOWN) return;
    lastSubmitTime = now;
    var statusEl = document.getElementById('submitStatus');
    statusEl.textContent = '⏳ Отправка в рейтинг...';

    fetchScores(true).then(function(scores) {
        var myId = String(tgUser.id);
        var myName = (tgUser.first_name || tgUser.username || 'игрок').substring(0, 30);
        var existing = null;
        for (var i = 0; i < scores.length; i++) {
            if (scores[i].id === myId) { existing = scores[i]; break; }
        }

        if (existing) {
            var better = false;
            if (finalScore > (existing.score || 0)) better = true;
            else if (finalScore === (existing.score || 0)) {
                if (finalRevives < (existing.revives || 0)) better = true;
                else if (finalRevives === (existing.revives || 0) && finalTime < (existing.time || 99999)) better = true;
            }
            if (!better) {
                statusEl.textContent = '✓ Твой рекорд в рейтинге: ' + existing.score;
                return;
            }
            existing.score = finalScore;
            existing.name = myName;
            existing.time = Math.round(finalTime);
            existing.revives = finalRevives;
            existing.date = now;
        } else {
            scores.push({ id: myId, name: myName, score: finalScore, time: Math.round(finalTime), revives: finalRevives, date: now });
        }
        sortScores(scores);
        return saveScores(scores.slice(0, 100)).then(function() {
            statusEl.textContent = '✓ Результат отправлен в рейтинг!';
        });
    }).catch(function(e) {
        console.warn('submit failed', e);
        statusEl.textContent = '⚠ Не удалось отправить';
    });
}

// ================== LEADERBOARD ==================
function renderLeaderboard(forceRefresh) {
    var listEl = document.getElementById('lbList');
    var cacheEl = document.getElementById('lbCacheInfo');

    if (!forceRefresh && scoresCache && (Date.now() - scoresCacheTime) < CACHE_TTL) {
        drawLeaderboard(scoresCache);
        var age = Math.round((Date.now() - scoresCacheTime) / 1000);
        cacheEl.textContent = 'данные из кэша (' + age + ' сек назад)';
        return;
    }

    listEl.innerHTML = '<div id="lbStatus">Загрузка...</div>';
    cacheEl.textContent = '';

    fetchScores(forceRefresh).then(function(scores) {
        drawLeaderboard(scores);
        cacheEl.textContent = 'обновлено только что';
    }).catch(function(e) {
        console.warn('lb failed', e);
        if (scoresCache) {
            drawLeaderboard(scoresCache);
            cacheEl.textContent = '⚠ сеть недоступна, показан кэш';
        } else {
            listEl.innerHTML = '<div id="lbStatus">⚠ Не удалось загрузить рейтинг</div>';
        }
    });
}

function drawLeaderboard(scores) {
    var listEl = document.getElementById('lbList');
    if (!scores.length) {
        listEl.innerHTML = '<div id="lbStatus">Пока никто не играл.<br>Стань первым! 🐍</div>';
        return;
    }
    sortScores(scores);
    var myId = tgUser ? String(tgUser.id) : null;
    var top = scores.slice(0, 10);
    var medals = ['🥇', '🥈', '🥉'];
    var html = '';
    for (var i = 0; i < top.length; i++) {
        var s = top[i];
        var isMe = myId && s.id === myId;
        var rankCls = i === 0 ? 'top1' : i === 1 ? 'top2' : i === 2 ? 'top3' : '';
        var rankContent = i < 3 ? medals[i] : '#' + (i + 1);
        var safeName = String(s.name || 'игрок').replace(/[<>&]/g, '');
        var timeStr = s.time ? formatTime(s.time) : '—';
        var revStr = (s.revives !== undefined) ? (s.revives + ' возр.') : '—';
        html += '<div class="lbRow' + (isMe ? ' me' : '') + '">' +
            '<div class="lbRank ' + rankCls + '">' + rankContent + '</div>' +
            '<div class="lbMain">' +
                '<div class="lbName">' + safeName + (isMe ? ' (ты)' : '') + '</div>' +
                '<div class="lbSub">⏱ ' + timeStr + ' · 🔄 ' + revStr + '</div>' +
            '</div>' +
            '<div class="lbScore">' + s.score + '</div>' +
            '</div>';
    }
    listEl.innerHTML = html;
}

// ================== SCREENS ==================
function showScreen(id) {
    var all = document.querySelectorAll('.screen');
    for (var i = 0; i < all.length; i++) all[i].classList.remove('active');
    document.getElementById(id).classList.add('active');
    leaderboardOpen = (id === 'leaderboardScreen');
    if (lbInterval) { clearInterval(lbInterval); lbInterval = null; }
    if (id === 'menuScreen') document.getElementById('menuHigh').textContent = highScore;
    if (id === 'leaderboardScreen') {
        renderLeaderboard(false);
        lbInterval = setInterval(function() { if (leaderboardOpen) renderLeaderboard(false); }, CACHE_TTL);
    }
}

function showSkinInfo() {
    var msg = 'Скины появятся после подключения Telegram Stars 🎨';
    if (tg) tg.showAlert(msg); else alert(msg);
}

function shareScore() {
    var text = '🐍 Я набрал ' + highScore + ' очков в Змейка Баттл! Попробуй побить мой рекорд:';
    var url = 'https://t.me/BattleSnakes_bot';
    if (tg) {
        tg.openTelegramLink('https://t.me/share/url?url=' + encodeURIComponent(url) + '&text=' + encodeURIComponent(text));
    } else { alert(text + ' ' + url); }
}

// ================== GAME ==================
function startGame() {
    initCanvas();
    showScreen('gameScreen');
    snake = [{x: 9, y: 10}, {x: 8, y: 10}, {x: 7, y: 10}];
    oldSnake = [];
    for (var i = 0; i < snake.length; i++) oldSnake.push({x: snake[i].x, y: snake[i].y});
    dir = {x: 1, y: 0}; nextDir = {x: 1, y: 0};
    score = 0; foodEaten = 0; speed = BASE_SPEED; running = true;
    lastTick = 0; lastFrameTime = 0; particles = [];
    frameCount = 0; fpsLastUpdate = 0;
    gameStartTime = performance.now();
    gameTime = 0;
    reviveCount = 0;
    savedState = null;
    placeFood();
    updateHud();
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
}

function loop(timestamp) {
    if (!running) return;
    if (!lastFrameTime) lastFrameTime = timestamp;
    frameCount++;
    if (!fpsLastUpdate) fpsLastUpdate = timestamp;
    if (timestamp - fpsLastUpdate > 500) {
        fps = Math.round(frameCount * 1000 / (timestamp - fpsLastUpdate));
        frameCount = 0; fpsLastUpdate = timestamp;
        var fpsEl = document.getElementById('fpsHud');
        if (fpsEl) fpsEl.textContent = fps + ' FPS';
    }
    if (!lastTick) lastTick = timestamp;
    if (timestamp - lastTick >= speed) { lastTick = timestamp; tick(); }
    var progress = Math.min(1, (timestamp - lastTick) / speed);
    updateParticles(16.67);
    render(progress);
    rafId = requestAnimationFrame(loop);
}

function tick() {
    oldSnake = [];
    for (var i = 0; i < snake.length; i++) oldSnake.push({x: snake[i].x, y: snake[i].y});
    dir = {x: nextDir.x, y: nextDir.y};
    var head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
    if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) return endGame();
    for (var i = 0; i < snake.length; i++) {
        if (snake[i].x === head.x && snake[i].y === head.y) return endGame();
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
        score += food.points; foodEaten++;
        speed = Math.max(MIN_SPEED, BASE_SPEED - foodEaten * SPEED_STEP);
        updateHud();
        haptic('light');
        var cx = food.x * cellSize + cellSize / 2;
        var cy = food.y * cellSize + cellSize / 2;
        spawnParticles(cx, cy, food.golden ? '#facc15' : '#ef4444');
        placeFood();
    } else { snake.pop(); }
}

function placeFood() {
    while (true) {
        var f = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
        var busy = false;
        for (var i = 0; i < snake.length; i++) {
            if (snake[i].x === f.x && snake[i].y === f.y) { busy = true; break; }
        }
        if (!busy) {
            f.golden = Math.random() < 0.15;
            f.points = f.golden ? 5 : 1;
            food = f; return;
        }
    }
}

function spawnParticles(x, y, color) {
    for (var i = 0; i < 12; i++) {
        var a = Math.random() * Math.PI * 2;
        var sp = 0.5 + Math.random() * 2.5;
        particles.push({ x: x, y: y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 1, color: color, size: 2 + Math.random()*3 });
    }
}

function updateParticles(dt) {
    var k = dt / 16.67;
    for (var i = particles.length - 1; i >= 0; i--) {
        var p = particles[i];
        p.x += p.vx * k; p.y += p.vy * k;
        p.vx *= 0.93; p.vy *= 0.93; p.life -= 0.03 * k;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function render(progress) {
    var w = canvasSize, h = canvasSize;
    ctx.fillStyle = '#0a0a14'; ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = 'rgba(74, 222, 128, 0.05)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (var i = 1; i < GRID; i++) {
        var p = i * cellSize;
        ctx.moveTo(p, 0); ctx.lineTo(p, h);
        ctx.moveTo(0, p); ctx.lineTo(w, p);
    }
    ctx.stroke();

    var pulse = 1 + Math.sin(performance.now() / 180) * 0.18;
    var fx = food.x * cellSize + cellSize / 2;
    var fy = food.y * cellSize + cellSize / 2;
    var fr = (cellSize / 2 - 1.5) * pulse;
    ctx.shadowColor = food.golden ? '#facc15' : '#ef4444';
    ctx.shadowBlur = food.golden ? 15 : 10;
    ctx.fillStyle = food.golden ? '#facc15' : '#ef4444';
    ctx.beginPath(); ctx.arc(fx, fy, fr, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;

    var len = snake.length;
    for (var i = len - 1; i >= 0; i--) {
        var newP = snake[i];
        var oldP = oldSnake[i] || newP;
        var ox = oldP.x, oy = oldP.y;
        if (Math.abs(newP.x - oldP.x) > 2) ox = newP.x;
        if (Math.abs(newP.y - oldP.y) > 2) oy = newP.y;
        var x = ox + (newP.x - ox) * progress;
        var y = oy + (newP.y - oy) * progress;
        if (i === 0) {
            ctx.fillStyle = '#4ade80'; ctx.shadowColor = '#4ade80'; ctx.shadowBlur = 14;
        } else {
            var t = i / Math.max(1, len);
            var r = Math.floor(34 + (74 - 34) * (1 - t));
            var g = Math.floor(197 + (222 - 197) * (1 - t));
            var b = Math.floor(94 + (128 - 94) * (1 - t));
            ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')'; ctx.shadowBlur = 0;
        }
        var pad = i === 0 ? 0.6 : 1.4;
        var px = x * cellSize + pad, py = y * cellSize + pad, ps = cellSize - pad * 2;
        ctx.beginPath();
        var rad = i === 0 ? ps * 0.35 : ps * 0.2;
        roundRect(ctx, px, py, ps, ps, rad);
        ctx.fill();
    }
    ctx.shadowBlur = 0;
    for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function roundRect(ctx, x, y, w, h, r) {
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
}

function updateHud() {
    document.getElementById('scoreHud').textContent = 'Счёт: ' + score;
    document.getElementById('speedHud').textContent = 'x' + (BASE_SPEED / speed).toFixed(1);
}

function endGame() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    haptic('medium');

    gameTime = (performance.now() - gameStartTime) / 1000;

    savedState = {
        score: score,
        foodEaten: foodEaten,
        snakeLen: snake.length
    };

    var isNewRecord = score > highScore;
    if (isNewRecord) {
        highScore = score;
        localStorage.setItem('snakeHigh', String(highScore));
        if (tg && tg.CloudStorage) tg.CloudStorage.setItem('snakeHighScore', String(highScore), function(){});
    }
    document.getElementById('overScore').textContent = 'Счёт: ' + score;
    document.getElementById('overInfo').textContent = '⏱ ' + formatTime(gameTime) + ' · 🔄 Возрождений: ' + reviveCount;
    document.getElementById('overHigh').textContent = isNewRecord ? '🎉 НОВЫЙ РЕКОРД!' : 'Рекорд: ' + highScore;
    document.getElementById('submitStatus').textContent = '';
    showScreen('overScreen');
    if (score > 0) submitScore(score, gameTime, reviveCount);
}

function setDir(d) {
    if (!running) return;
    var dirs = { up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0} };
    var nd = dirs[d];
    if (!nd) return;
    if (nd.x === -dir.x && nd.y === -dir.y) return;
    if (nd.x === nextDir.x && nd.y === nextDir.y) return;
    nextDir = nd;
    haptic('light');
}

function haptic(type) {
    try { if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred(type || 'light'); } catch(e){}
}

// ================== BUY LIFE ==================
function buyLife() {
    if (isBuyingLife || !savedState) return;
    isBuyingLife = true;
    var btn = document.getElementById('buyLifeBtn');
    btn.textContent = '⏳ Создание счёта...';

    setTimeout(function() {
        btn.textContent = '💚 Вторая жизнь за 15⭐';
        isBuyingLife = false;
        startCountdown(function() {
            reviveSnake();
            if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        });
    }, 700);
}

function startCountdown(callback) {
    var el = document.getElementById('countdown');
    el.classList.add('show');
    var count = 3;

    function tickCount() {
        el.textContent = count > 0 ? String(count) : 'GO!';
        el.classList.remove('pulse');
        void el.offsetWidth;
        el.classList.add('pulse');
        haptic('medium');

        if (count < 0) {
            el.classList.remove('show');
            el.classList.remove('pulse');
            callback();
            return;
        }
        count--;
        setTimeout(tickCount, 1000);
    }
    tickCount();
}

function reviveSnake() {
    if (!savedState) return;

    var len = Math.min(savedState.snakeLen, 10);
    snake = [];
    var startX = 10, startY = 10;
    for (var i = 0; i < len; i++) {
        snake.push({ x: startX - i, y: startY });
    }
    oldSnake = [];
    for (var i = 0; i < snake.length; i++) oldSnake.push({x: snake[i].x, y: snake[i].y});

    score = savedState.score;
    foodEaten = savedState.foodEaten;
    reviveCount++;

    dir = {x: 1, y: 0};
    nextDir = {x: 1, y: 0};

    speed = Math.min(BASE_SPEED, Math.max(MIN_SPEED, BASE_SPEED - foodEaten * SPEED_STEP + 30));

    running = true;
    lastTick = 0;
    lastFrameTime = 0;
    particles = [];
    placeFood();
    updateHud();
    showScreen('gameScreen');
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
}

// ================== DIRECTION BUTTONS ==================
function bindDirButton(el) {
    var pressed = false;
    function down(e) {
        e.preventDefault();
        if (pressed) return;
        pressed = true;
        el.classList.add('pressed');
        setDir(el.dataset.dir);
    }
    function up() {
        pressed = false;
        el.classList.remove('pressed');
    }
    el.addEventListener('touchstart', down, {passive: false});
    el.addEventListener('touchend', up);
    el.addEventListener('touchcancel', up);
    el.addEventListener('mousedown', down);
    el.addEventListener('mouseup', up);
    el.addEventListener('mouseleave', up);
}

var dirBtns = document.querySelectorAll('.btn');
for (var i = 0; i < dirBtns.length; i++) bindDirButton(dirBtns[i]);

// ================== SWIPES ==================
var touchX = null, touchY = null;
document.getElementById('gameScreen').addEventListener('touchstart', function(e) {
    if (e.target.id === 'game') { touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; }
}, {passive: true});

document.getElementById('gameScreen').addEventListener('touchend', function(e) {
    if (touchX === null) return;
    var dx = e.changedTouches[0].clientX - touchX;
    var dy = e.changedTouches[0].clientY - touchY;
    if (Math.abs(dx) > 25 || Math.abs(dy) > 25) {
        if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 'right' : 'left');
        else setDir(dy > 0 ? 'down' : 'up');
    }
    touchX = null; touchY = null;
}, {passive: true});

document.addEventListener('keydown', function(e) {
    var map = {ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};
    if (map[e.key]) { e.preventDefault(); setDir(map[e.key]); }
});

window.addEventListener('resize', function() { if (running) initCanvas(); });

// ================== START ==================
setupUser();
if (tg && tg.CloudStorage) {
    tg.CloudStorage.getItem('snakeHighScore', function(err, val) {
        if (!err && val) {
            var cs = parseInt(val, 10);
            if (cs > highScore) {
                highScore = cs;
                localStorage.setItem('snakeHigh', String(highScore));
                document.getElementById('menuHigh').textContent = highScore;
            }
        }
    });
}
document.getElementById('menuHigh').textContent = highScore;
</script>
