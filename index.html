<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Змейка Баттл</title>
    <style>
        body {
            margin: 0;
            background: #0f0f1a;
            color: white;
            font-family: -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        #score {
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: bold;
            color: #4ade80;
        }
        canvas {
            background: #1a1a2e;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.2);
            touch-action: none;
        }
        #controls {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(2, 60px);
            gap: 10px;
            justify-content: center;
        }
        .btn {
            background: #2a2a40;
            border: 1px solid #4ade80;
            color: white;
            font-size: 24px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .btn:active { background: #4ade80; color: #0f0f1a; }
        #restart {
            display: none;
            margin-top: 15px;
            padding: 10px 20px;
            background: #4ade80;
            color: #0f0f1a;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div id="score">Счёт: 0</div>
    <canvas id="game" width="300" height="300"></canvas>
    <button id="restart">Заново</button>
    <div id="controls">
        <div></div>
        <div class="btn" data-dir="up">▲</div>
        <div></div>
        <div class="btn" data-dir="left">◀</div>
        <div class="btn" data-dir="down">▼</div>
        <div class="btn" data-dir="right">▶</div>
    </div>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const restartBtn = document.getElementById('restart');

    const gridSize = 15;
    const cellSize = canvas.width / gridSize;
    let snake, food, direction, nextDirection, score, gameLoop, isGameOver           ;

    function init() {
        return snake = [{x:  end7, y: 7}];
       Game direction = {x: 0, y: ();
0};
        nextDirection =        {x: 0, y: 0};
        score = 0;
        isGameOver = false;
        scoreEl.textContent = 'Счёт: 0';
        restartBtn.style.display = 'none';
        placeFood();
        if (gameLoop) clearInterval(gameLoop);
        gameLoop = setInterval(update, 150);
    }

    function placeFood() {
        let newFood;
        while (true) {
            newFood = {
                x: Math.floor(Math.random() * gridSize),
                y: Math.floor(Math.random() * gridSize)
            };
            if (!snake.some(s => s.x === newFood.x && s.y === newFood.y)) break;
        }
        food = newFood;
    }

    function update() {
        if (isGameOver) return;

        direction = {...nextDirection};
        if (direction.x === 0 && direction.y === 0) return;

        const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};

        // Стены
        if (head.x < 0 || head.x >= gridSize || head.y < 0 || head.y >= gridSize) {
            return endGame();
        }
        // Себя
        if (snake.some(s => s.x === head.x && s.y === head.y)) {
 }

        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
            score++;
            scoreEl.textContent = 'Счёт: ' + score;
            placeFood();
        } else {
            snake.pop();
        }

        draw();
    }

    function draw() {
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Еда
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(food.x * cellSize + cellSize/2, food.y * cellSize + cellSize/2, cellSize/2 - 2, 0, Math.PI * 2);
        ctx.fill();

        // Змейка
        snake.forEach((seg, i) => {
            ctx.fillStyle = i === 0 ? '#4ade80' : '#22c55e';
            ctx.fillRect(seg.x * cellSize + 1, seg.y * cellSize + 1, cellSize - 2, cellSize - 2);
        });
    }

    function endGame() {
        isGameOver = true;
        clearInterval(gameLoop);
        restartBtn.style.display = 'block';
    }

    function setDirection(dir) {
        if (isGameOver) return;
        const dirs = {
            up: {x: 0, y: -1},
            down: {x: 0, y: 1},
            left: {x: -1, y: 0},
            right: {x: 1, y: 0}
        };
        const newDir = dirs[dir];
        // Нельзя развернуться на 180
        if (newDir.x === -direction.x && newDir.y === -direction.y) return;
        nextDirection = newDir;
    }

    // Кнопки
    document.querySelectorAll('.btn').forEach(btn => {
        btn.addEventListener('click', () => setDirection(btn.dataset.dir));
    });

    // Свайпы
    let touchStartX, touchStartY;
    canvas.addEventListener('touchstart', e => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
    }, {passive: true});

    canvas.addEventListener('touchend', e => {
        if (!touchStartX) return;
        const dx = e.changedTouches[0].clientX - touchStartX;
        const dy = e.changedTouches[0].clientY - touchStartY;
        if (Math.abs(dx) > Math.abs(dy)) {
            setDirection(dx > 0 ? 'right' : 'left');
        } else {
            setDirection(dy > 0 ? 'down' : 'up');
        }
        touchStartX = null;
    }, {passive: true});

    // Стрелки клавиатуры (на всякий)
    document.addEventListener('keydown', e => {
        const map = {ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right'};
        if (map[e.key]) setDirection(map[e.key]);
    });

    restartBtn.addEventListener('click', init);

    init();
</script>
</body>
</html>
