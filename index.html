<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Диагностика</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <style>
        body {
            background: #0f0f1a; color: #e2e8f0;
            font-family: -apple-system, monospace;
            padding: 16px; margin: 0;
            font-size: 13px; line-height: 1.5;
        }
        h2 { color: #4ade80; font-size: 18px; margin: 0 0 16px; }
        .step { padding: 8px 10px; margin: 6px 0; border-radius: 8px; background: #1a1a2e; }
        .ok { color: #4ade80; }
        .err { color: #ef4444; }
        .wait { color: #facc15; }
        button {
            width: 100%; padding: 14px; margin-top: 16px;
            background: #4ade80; color: #0f0f1a; border: none;
            border-radius: 10px; font-weight: bold; font-size: 16px;
        }
    </style>
</head>
<body>
    <h2>🔍 Диагностика</h2>
    <div id="log"></div>
    <button onclick="runTest()">Запустить тест</button>
    <button onclick="location.reload()" style="background:#334155;color:#e2e8f0;margin-top:8px;">🔄 Перезагрузить</button>

<script>
const logEl = document.getElementById('log');

function log(msg, type) {
    const cls = type === 'ok' ? 'ok' : type === 'err' ? 'err' : 'wait';
    const div = document.createElement('div');
    div.className = 'step ' + cls;
    div.textContent = msg;
    logEl.appendChild(div);
    console.log(msg);
}

async function runTest() {
    logEl.innerHTML = '';
    log('1. Проверка Telegram SDK...');
    if (window.Telegram && window.Telegram.WebApp) {
        log('✓ Telegram SDK загружен', 'ok');
        const u = window.Telegram.WebApp.initDataUnsafe?.user;
        if (u) log('  Юзер: ' + u.first_name + ' (id: ' + u.id + ')', 'ok');
        else log('  Юзер: не определён (открой через бота)', 'err');
    } else {
        log('✗ Telegram SDK НЕ загружен', 'err');
    }

    log('2. Проверка Firebase SDK...');
    if (typeof firebase === 'undefined') {
        log('✗ Firebase SDK НЕ загружен', 'err');
        return;
    }
    log('✓ Firebase SDK загружен', 'ok');

    log('3. Инициализация Firebase...');
    const firebaseConfig = {
        apiKey: "AIzaSyBkqNXGyWIHRGzv8woTZg_CdC73Zimnipc",
        authDomain: "snake-battle-2ce38.firebaseapp.com",
        projectId: "snake-battle-2ce38",
        storageBucket: "snake-battle-2ce38.firebasestorage.app",
        messagingSenderId: "855108268533",
        appId: "1:855108268533:web:5a017900dcae08dc3cf0bc"
    };

    let db;
    try {
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        log('✓ Firebase инициализирован', 'ok');
        log('  Проект: ' + firebaseConfig.projectId, 'ok');
    } catch(e) {
        log('✗ Ошибка init: ' + e.message, 'err');
        return;
    }

    log('4. Тест ЗАПИСИ в Firestore...');
    try {
        const testId = 'test_' + Date.now();
        await db.collection('scores').doc(testId).set({
            name: 'Diagnostic',
            score: 42,
            date: Date.now()
        });
        log('✓ Запись успешна! ID: ' + testId, 'ok');
    } catch(e) {
        log('✗ Ошибка записи: ' + e.code + ' — ' + e.message, 'err');
        return;
    }

    log('5. Тест ЧТЕНИЯ из Firestore...');
    try {
        const snap = await db.collection('scores').orderBy('score', 'desc').limit(10).get();
        log('✓ Чтение успешно! Найдено: ' + snap.size + ' документов', 'ok');
        snap.forEach(doc => {
            log('  ' + doc.data().name + ' — ' + doc.data().score);
        });
    } catch(e) {
        log('✗ Ошибка чтения: ' + e.code + ' — ' + e.message, 'err');
    }

    log('✅ ТЕСТ ЗАВЕРШЁН', 'ok');
}

window.addEventListener('load', () => {
    setTimeout(runTest, 500);
});
</script>
</body>
</html>
