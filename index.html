<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Змейка Баттл</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            background: #0f0f1a;
            color: white;
            font-family: -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
            padding: 10px;
        }
        #score {
            font-size: 22px;
            margin-bottom: 12px;
            font-weight: bold;
            color: #4ade80;
        }
        #game {
            background: #1a1a2e;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.25);
            touch-action: none;
            max-width: 90vw;
            max-height: 55vh;
        }
        #controls {
            margin-top: 16px;
            display: grid;
            grid-template-columns: repeat(3, 64px);
            grid-template-rows: repeat(2, 64px);
            gap: 10px;
        }
        .btn {
            background: #2a2a40;
            border: 2px solid #4ade80;
            color: white;
            font-size: 26px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn:active { background: #4ade80; color: #0f0f1a; }
        #restart {
            display: none;
            margin-top: 14px;
            padding: 12px 24px;
            background: #4ade80;
            color: #0f0f1a;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div id="score">Счёт: 0</div>
    <canvas id="game" width="300" height="300"></canvas>
    <button id="restart">Заново</button>
    <div id="controls">
        <div></div>
        <div class="btn" data-dir="up">▲</div>
        <div></div>
        <div class="btn" data-dir="left">◀</div>
        <div class="btn" data-dir="down">▼</div>
        <div class="btn" data-dir="right">▶</div>
    </div>

<script>
    var canvas = document.getElementById('game');
    var ctx = canvas.getContext('2d');
    var scoreEl = document.getElementById('score');
    var restartBtn = document.getElementById('restart');

    var gridSize = 15;
    var cellSize = canvas.width / gridSize;
    var snake, food, direction, nextDirection, score, gameLoop, isGameOver;

    function init() {
        snake = [{x: 7, y: 7}, {x: 6, y: 7}, {x: 5, y: 7}];
        direction = {x: 1, y: 0};      // едет вправо
        nextDirection = {x: 1, y: 0};
        score = 0;
        isGameOver = false;
        scoreEl.textContent = 'Счёт: 0';
        restartBtn.style.display = 'none';
        placeFood();
        draw();                        // сразу рисуем поле
        if (gameLoop) clearInterval(gameLoop);
        gameLoop = setInterval(update, 180);
    }

    function placeFood() {
        while (true) {
            var f = {
                x: Math.floor(Math.random() * gridSize),
                y: Math.floor(Math.random() * gridSize)
            };
            var onSnake = false;
            for (var i = 0; i < snake.length; i++) {
                if (snake[i].x === f.x && snake[i].y === f.y) { onSnake = true; break; }
            }
            if (!onSnake) { food = f; return; }
        }
    }

    function update() {
        if (isGameOver) return;

        direction = {x: nextDirection.x, y: nextDirection.y};
        var head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};

        // столкновение со стеной
        if (head.x < 0 || head.x >= gridSize || head.y < 0 || head.y >= gridSize) {
            return endGame();
        }
        // столкновение с собой
        for (var i = 0; i < snake.length; i++) {
            if (snake[i].x === head.x && snake[i].y === head.y) {
                return endGame();
            }
        }

        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
            score++;
            scoreEl.textContent = 'Счёт: ' + score;
            placeFood();
        } else {
            snake.pop();
        }

        draw();
    }

    function draw() {
        // фон
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // еда
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(
            food.x * cellSize + cellSize / 2,
            food.y * cellSize + cellSize / 2,
            cellSize / 2 - 2, 0, Math.PI * 2
        );
        ctx.fill();

        // змейка
        for (var i = 0; i < snake.length; i++) {
            ctx.fillStyle = (i === 0) ? '#4ade80' : '#22c55e';
            ctx.fillRect(
                snake[i].x * cellSize + 1,
                snake[i].y * cellSize + 1,
                cellSize - 2,
                cellSize - 2
            );
        }
    }

    function endGame() {
        isGameOver = true;
        clearInterval(gameLoop);
        restartBtn.style.display = 'block';
    }

    function setDirection(dir) {
        if (isGameOver) return;
        var dirs = {
            up:    {x: 0,  y: -1},
            down:  {x: 0,  y: 1},
            left:  {x: -1, y: 0},
            right: {x: 1,  y: 0}
        };
        var nd = dirs[dir];
        if (!nd) return;
        // нельзя развернуться на 180°
        if (nd.x === -direction.x && nd.y === -direction.y) return;
        nextDirection = nd;
    }

    // кнопки
    var btns = document.querySelectorAll('.btn');
    for (var i = 0; i < btns.length; i++) {
        (function(b){
            b.addEventListener('click', function(){ setDirection(b.dataset.dir); });
        })(btns[i]);
    }

    // свайпы
    var touchStartX = null, touchStartY = null;
    canvas.addEventListener('touchstart', function(e){
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
    }, {passive: true});

    canvas.addEventListener('touchend', function(e){
        if (touchStartX === null) return;
        var dx = e.changedTouches[0].clientX - touchStartX;
        var dy = e.changedTouches[0].clientY - touchStartY;
        if (Math.abs(dx) > Math.abs(dy)) {
            setDirection(dx > 0 ? 'right' : 'left');
        } else {
            setDirection(dy > 0 ? 'down' : 'up');
        }
        touchStartX = null;
    }, {passive: true});

    // клавиатура (на всякий)
    document.addEventListener('keydown', function(e){
        var map = {ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right'};
        if (map[e.key]) setDirection(map[e.key]);
    });

    restartBtn.addEventListener('click', init);

    init();
</script>
</body>
</html>
